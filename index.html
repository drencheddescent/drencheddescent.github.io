<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Drenched Descent</title>
  <style>
    body{font-family:system-ui,Segoe UI,Roboto,Arial;margin:18px;background:#0b0b0b;color:#e6e6e6}
    .card{background:#111;padding:18px;border-radius:10px;max-width:760px;margin:12px auto;box-shadow:0 6px 18px rgba(0,0,0,.6)}
    input,button{font-size:16px;padding:8px 10px;border-radius:6px;border:1px solid #222;background:#0f0f10;color:#ddd}
    button{cursor:pointer;margin-left:8px}
    #mapinfo{margin-top:12px;font-size:14px}
    audio{width:100%;margin-top:12px}
  </style>
</head>
<body>
  <div class="card">
    <h2>connect to play bgm</h2>
    <div>
      <label>roblox username: <input id="username" placeholder="Ant" /></label>
      <button id="connect">connect</button>
    </div>
    <div id="status" style="margin-top:10px">not connected</div>
    <div id="mapinfo"></div>
    <audio id="bgmPlayer" controls></audio>
    <div style="margin-top:10px;font-size:13px;color:#aaa">
      note: press connect then allow audio playback when prompted
    </div>
  </div>

<script>
(function(){
  const WASMER_BASE = 'https://smallphpproxy-0ef01.wasmer.app'; // your wasmer domain
  const STATUS = document.getElementById('status');
  const MAPINFO = document.getElementById('mapinfo');
  const PLAYER = document.getElementById('bgmPlayer');
  const BTN = document.getElementById('connect');

  function b64url(s){ return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }

  BTN.addEventListener('click', function(){
    const user = document.getElementById('username').value.trim();
    if (!user) return alert('enter username');

    STATUS.textContent = 'connecting to events...';
    // SSE to Wasmer events.php
    const es = new EventSource(WASMER_BASE + '/events.php?user=' + encodeURIComponent(user));

    es.addEventListener('open', ()=> STATUS.textContent = 'connected as ' + user);
    es.addEventListener('error', (e)=> {
      STATUS.textContent = 'sse error';
      console.warn('sse error', e);
    });

    es.addEventListener('mapstart', function(e){
      try {
        const parsed = JSON.parse(e.data);
        const p = parsed.payload || parsed;
        MAPINFO.textContent = 'map: ' + (p.map || 'unknown') + ' | raw: ' + (p.rawbgm || p.bgm || '');
        // if valid field present and true, prefer using proxy (more reliable)
        const url = p.bgm || p.rawbgm || '';
        if (!url) {
          STATUS.textContent = 'no bgm for this map';
          return;
        }

        if (p.valid === false) {
          STATUS.textContent = 'bgm not playable directly; using proxy';
          PLAYER.src = WASMER_BASE + '/proxy.php?url=' + encodeURIComponent(url);
        } else {
          // try direct first (less bandwidth). fallback to proxy on error.
          PLAYER.src = url;
          PLAYER.play().catch(()=>{ /* autoplay blocked */ });
          // set an error handler to fallback
          PLAYER.onerror = function(){
            STATUS.textContent = 'direct play failed, falling back to proxy';
            PLAYER.src = WASMER_BASE + '/proxy.php?url=' + encodeURIComponent(url);
            PLAYER.play().catch(()=>{});
          };
        }
        STATUS.textContent = 'playing: ' + (p.map || 'unknown');
      } catch (err) {
        console.error('bad sse payload', err);
      }
    });
  });
})();
</script>
</body>
</html>
